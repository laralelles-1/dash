<script>
const SHEET_ID = '1f6QhW9hMR7EBq5KrgKhFxVEHvyvjxbcshcevSYJkVi8';

// ── Busca aba via export CSV (funciona com planilha pública, HTTPS, sem CORS) ─
async function fetchSheet(sheetName) {
  const url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
    '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(sheetName);
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + sheetName);
  const text = await res.text();
  // parse CSV respeitando aspas
  return text.trim().split('\n').map(line => {
    const cols = []; let cur = ''; let inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    return cols;
  });
}

// ── Extrai acumulado mensal de uma lista de linhas ───────────────────────────
// Procura linha com label parecido, pega última coluna "Acumulado mensal"
// A planilha tem col "Acumulado mensal" como última coluna com header.
// Strategy: pega o valor da última célula não-vazia da linha.
function extract(rows, ...keywords) {
  const kws = keywords.map(k => k.toLowerCase());
  for (const r of rows) {
    const lbl = (r[0] || '').toLowerCase().trim();
    if (!lbl) continue;
    const match = kws.some(k => lbl.includes(k));
    if (!match) continue;
    // pega última célula não vazia, não traço
    for (let i = r.length - 1; i >= 1; i--) {
      const v = (r[i] || '').trim();
      if (v && v !== '-' && v !== '\\-' && v !== '—' && !v.startsWith('#')) {
        return toNum(v);
      }
    }
  }
  return null;
}

function toNum(v) {
  if (v == null) return null;
  const s = String(v).replace(/[R$\s]/g,'').replace(/\./g,'').replace(',','.').trim();
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

function fmt(v) {
  if (v === null || v === undefined) return '—';
  if (Math.abs(v) >= 1e6) return (v/1e6).toFixed(1) + 'M';
  return v.toLocaleString('pt-BR');
}

function pct(a, b) {
  if (a == null || b == null || a === 0) return null;
  return Math.round(((b - a) / Math.abs(a)) * 100);
}

function bk(v, dir) {
  if (v === null) return '<span class="bk na">sem dado</span>';
  if (v === 0) return '<span class="bk nt">=</span>';
  const pos = v > 0;
  const cls = dir === 'good' ? (pos ? 'gn' : 'rd') : (pos ? 'rd' : 'gn');
  return `<span class="bk ${cls}">${pos ? '+' : ''}${v}%</span>`;
}

// ── Parse cada aba em KPIs ────────────────────────────────────────────────────
function parseMonth(rows) {
  return {
    eng_tarefas:   extract(rows, 'tarefas/story entregues', 'tarefas/story'),
    eng_bugs:      extract(rows, 'bugs corrigidos'),
    eng_backlog:   extract(rows, 'bugs em backlog'),
    eng_wip:       extract(rows, 'em andamento', 'demandas em andamento'),
    inf_inc:       extract(rows, 'incidentes (infra', 'incidentes no mês'),
    inf_n8n:       extract(rows, 'falhas nos workflows do n8n', 'falhas em workflows do n8n por infra (crashes)', 'falhas nos workflows'),
    inf_n8n_infra: extract(rows, 'falhas em workflows do n8n por infra (crashes)'),
    inf_n3:        extract(rows, 'demandas n3'),
    inf_msg:       extract(rows, 'mensagens trocadas'),
    inf_logins:    extract(rows, 'logins'),
    inf_oracle:    extract(rows, 'consumo de nuvem em créditos ($$) - oracle'),
    inf_oracle_ia: extract(rows, 'consumo de ia em créditos ($$) - oracle'),
    inf_openai:    extract(rows, 'consumo de ia em créditos ($$) - open'),
    dat_plan:      extract(rows, 'demandas planejadas'),
    dat_entr:      extract(rows, 'demandas entregues'),
    dat_atrs:      extract(rows, 'demandas atrasadas'),
    dat_pipe:      extract(rows, 'falhas na execução da pipeline'),
    dat_dash:      extract(rows, 'falhas em dashboards'),
  };
}

// ── Gráficos ─────────────────────────────────────────────────────────────────
let charts = {};
function dch() { Object.values(charts).forEach(c => c.destroy()); charts = {}; }

function mkBar(id, labels, datasets) {
  const el = document.getElementById(id); if (!el) return;
  charts[id] = new Chart(el, { type:'bar', data:{labels,datasets},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{ticks:{font:{size:11},color:'#999'},grid:{display:false}},
              y:{ticks:{font:{size:11},color:'#999',callback:v=>Math.abs(v)>=1000?Math.round(v/1000)+'k':v},grid:{color:'rgba(0,0,0,.06)'},beginAtZero:true}}}});
}
function mkLine(id, labels, datasets) {
  const el = document.getElementById(id); if (!el) return;
  charts[id] = new Chart(el, { type:'line', data:{labels,datasets},
    options:{responsive:true,maintainAspectRatio:false,spanGaps:true,plugins:{legend:{display:false}},
      scales:{x:{ticks:{font:{size:11},color:'#999'},grid:{display:false}},
              y:{ticks:{font:{size:11},color:'#999',callback:v=>Math.abs(v)>=1000?Math.round(v/1000)+'k':v},grid:{color:'rgba(0,0,0,.06)'}}}}});
}

          <tr><td>Demandas entregues</td><td>${fmt(de[0])}</td><td>${fmt(de[1])}</td><td>${fmt(de[2])}</td><td>${bk(pct(de[0],de[1]),'good')}</td><td>${bk(pct(de[1],de[2]),'good')}</td></tr>
          <tr><td>Demandas atrasadas</td><td>${fmt(da[0])}</td><td>${fmt(da[1])}</td><td>${fmt(da[2])}</td><td><span class="bk gn">=</span></td><td>${bk(pct(da[1],da[2]),'bad')}</td></tr>
          <tr><td>Falhas na pipeline</td><td>${fmt(dpi[0])}</td><td>—</td><td>${fmt(dpi[2])}</td><td><span class="bk na">sem dado</span></td><td><span class="bk na">sem dado</span></td></tr>
          <tr><td>Falhas em dashboards</td><td>${fmt(dd[0])}</td><td>—</td><td>${fmt(dd[2])}</td><td><span class="bk na">sem dado</span></td><td>${bk(pct(dd[0],dd[2]),'bad')}</td></tr>
        </tbody>
      </table></div>
      <div class="sl">Planejadas vs entregues</div>
      <div class="leg"><span><span class="leg-sq" style="background:#FAC775"></span>Planejadas</span><span><span class="leg-sq" style="background:#9FE1CB"></span>Entregues</span></div>
      <div class="cw" style="height:195px"><canvas id="c-dat-bar"></canvas></div>
      <div class="sl">Falhas em dashboards</div>
      <div class="cw" style="height:180px"><canvas id="c-dat-dash"></canvas></div>
    </div>
  </div>`;

  const ln = (color, bg) => ({borderColor:color, backgroundColor:bg, borderWidth:2, pointRadius:5, pointBackgroundColor:color, fill:true, tension:0.3});
  mkBar('c-all-bar', ['Tarefas','Bugs','Incidentes'], [
    {label:'Março', data:[ev[0],eb[0],ii[0]], backgroundColor:'#B5D4F4', borderColor:'#378ADD', borderWidth:1, borderRadius:4},
    {label:'Abril', data:[ev[1],eb[1],ii[1]], backgroundColor:'#9FE1CB', borderColor:'#1D9E75', borderWidth:1, borderRadius:4},
    {label:'Maio',  data:[ev[2],eb[2],ii[2]], backgroundColor:'#FAC775', borderColor:'#EF9F27', borderWidth:1, borderRadius:4},
  ]);
  mkLine('c-all-n8n',  M, [{label:'n8n', data:in8, ...ln('#E24B4A','rgba(226,75,74,.07)')}]);
  mkLine('c-eng-line', M, [
    {label:'Tarefas', data:ev, ...ln('#639922','rgba(99,153,34,.07)')},
    {label:'Bugs', data:eb, borderColor:'#E24B4A', borderWidth:2, pointRadius:5, pointBackgroundColor:'#E24B4A', pointStyle:'triangle', fill:false, tension:0.3},
    {label:'WIP', data:ew, borderColor:'#888', borderDash:[5,4], borderWidth:1.5, pointRadius:4, pointBackgroundColor:'#888', fill:false, tension:0.3},
  ]);
  mkLine('c-inf-n8n', M, [{label:'n8n', data:in8, ...ln('#E24B4A','rgba(226,75,74,.07)')}]);
  mkBar('c-inf-inc',  M, [{label:'Inc', data:ii, backgroundColor:['#B5D4F4','#9FE1CB','#FAC775'], borderColor:['#378ADD','#1D9E75','#EF9F27'], borderWidth:1, borderRadius:4}]);
  mkBar('c-dat-bar',  M, [
    {label:'Plan', data:dp, backgroundColor:'#FAC775', borderColor:'#EF9F27', borderWidth:1, borderRadius:4},
    {label:'Entr', data:de, backgroundColor:'#9FE1CB', borderColor:'#1D9E75', borderWidth:1, borderRadius:4},
  ]);
  mkLine('c-dat-dash', ['Março','(Abr s/ dado)','Maio'], [{label:'Dash', data:[dd[0],null,dd[2]], ...ln('#EF9F27','rgba(239,159,39,.08)'), spanGaps:true}]);
}

function setTab(t) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.sec').forEach(s => s.classList.remove('visible'));
  document.querySelector('.tab.' + t).classList.add('active');
  document.getElementById('sec-' + t).classList.add('visible');
}

async function loadData() {
  const btn = document.getElementById('btnRefresh');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin">↻</span> Buscando…';

  try {
    const [rowsMar, rowsAbr, rowsMai] = await Promise.all([
      fetchSheet('Mar/2026'),
      fetchSheet('Abril/2026'),
      fetchSheet('Maio/2026'),
    ]);
    const mar = parseMonth(rowsMar);
    const abr = parseMonth(rowsAbr);
    const mai = parseMonth(rowsMai);
    render(mar, abr, mai);
    document.getElementById('upd').textContent = 'Atualizado ' +
      new Date().toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
  } catch(e) {
    document.getElementById('root').innerHTML =
      `<div class="wrap"><div class="err">⚠️ Erro ao buscar dados: <b>${e.message}</b><br><br>
      Verifique se a planilha está pública (Compartilhar → "Qualquer pessoa com o link").<br>
      Nomes das abas esperados: <code>Mar/2026</code>, <code>Abril/2026</code>, <code>Maio/2026</code></div></div>`;
  }

  btn.disabled = false;
  btn.innerHTML = '↻ Atualizar';
}

loadData();
</script>
