<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — Eng, Infra e Dados</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;color:#1a1a1a;font-size:14px}
.hdr{background:#fff;border-bottom:.5px solid #e0ddd5;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:8px;flex-wrap:wrap}
.hdr h1{font-size:15px;font-weight:500}
.hr{display:flex;align-items:center;gap:8px}
.upd{font-size:11px;color:#999}
.btn{font-size:12px;padding:5px 11px;border:.5px solid #d0cdc5;border-radius:8px;background:#fff;cursor:pointer;color:#444;transition:all .15s;display:flex;align-items:center;gap:5px}
.btn:hover{background:#f0efe8}
.btn:disabled{opacity:.5;cursor:not-allowed}
.spin{display:inline-block;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* filtro modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:200;align-items:flex-start;justify-content:flex-end}
.modal-bg.open{display:flex}
.modal{background:#fff;border:.5px solid #e0ddd5;border-radius:12px;padding:20px;margin:56px 16px 0 0;width:300px;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.modal h2{font-size:13px;font-weight:500;margin-bottom:14px;color:#1a1a1a}
.modal-section{margin-bottom:16px}
.modal-section label{font-size:11px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:8px}
.pill-group{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;padding:4px 11px;border-radius:20px;border:.5px solid #d0cdc5;background:#fff;cursor:pointer;color:#555;transition:all .15s}
.pill:hover{background:#f0efe8}
.pill.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.modal-close{width:100%;margin-top:4px;padding:7px;border-radius:8px;border:.5px solid #d0cdc5;background:#f5f5f0;cursor:pointer;font-size:12px;color:#555}
.modal-close:hover{background:#e8e7e0}
.filter-badge{background:#1a1a1a;color:#fff;border-radius:50%;font-size:10px;font-weight:600;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;margin-left:2px}

.wrap{padding:18px 20px;max-width:1100px;margin:0 auto}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tab{font-size:12px;font-weight:500;padding:5px 13px;border-radius:8px;border:.5px solid #d0cdc5;background:#fff;color:#666;cursor:pointer;transition:all .15s}
.tab.active.all{background:#f0efe8;color:#1a1a1a;border-color:#bbb}
.tab.active.eng{background:#EAF3DE;color:#3B6D11;border-color:#C0DD97}
.tab.active.inf{background:#E6F1FB;color:#185FA5;border-color:#B5D4F4}
.tab.active.dat{background:#FAEEDA;color:#854F0B;border-color:#FAC775}
.sec{display:none}.sec.visible{display:block}
.sl{font-size:11px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.06em;margin:18px 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px;margin-bottom:4px}
.card{background:#fff;border:.5px solid #e0ddd5;border-radius:10px;padding:12px 14px}
.card .lbl{font-size:11px;color:#888;margin-bottom:5px}
.card .val{font-size:21px;font-weight:500;line-height:1.1}
.card .sub{font-size:11px;margin-top:5px}
.bk{font-size:11px;font-weight:500;padding:2px 7px;border-radius:6px;display:inline-block;white-space:nowrap}
.bk.gn{background:#EAF3DE;color:#3B6D11}
.bk.rd{background:#FCEBEB;color:#A32D2D}
.bk.am{background:#FAEEDA;color:#854F0B}
.bk.nt{background:#f0efe8;color:#666}
.bk.na{background:#f0efe8;color:#aaa;font-size:10px}
.tw{overflow-x:auto;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:12px;background:#fff;border-radius:10px;overflow:hidden;border:.5px solid #e0ddd5}
thead th{font-size:10.5px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.04em;padding:7px 10px;border-bottom:.5px solid #e0ddd5;text-align:right;white-space:nowrap;background:#fafaf7}
thead th:first-child{text-align:left}
tbody td{padding:7px 10px;border-bottom:.5px solid #f0efe8;text-align:right;vertical-align:middle;white-space:nowrap}
tbody td:first-child{text-align:left;color:#555;white-space:normal;max-width:220px}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fafaf7}
.cw{background:#fff;border:.5px solid #e0ddd5;border-radius:10px;padding:14px;margin-bottom:4px}
.leg{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px;font-size:11px;color:#666}
.leg span{display:flex;align-items:center;gap:4px}
.leg-sq{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.err{background:#FCEBEB;color:#A32D2D;padding:16px;border-radius:10px;font-size:13px;margin:20px 0;line-height:1.6}
.ctx-bar{background:#fff;border:.5px solid #e0ddd5;border-radius:8px;padding:8px 13px;font-size:12px;color:#555;margin-bottom:16px;display:flex;align-items:center;gap:6px}
.ctx-bar span{font-weight:500;color:#1a1a1a}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <h1>📊 Engenharia, Infra e Dados</h1>
  <div class="hr">
    <span class="upd" id="upd">—</span>
    <button class="btn" onclick="toggleFilter()" id="btnFilter">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><line x1="8" y1="5" x2="8" y2="8"/><circle cx="8" cy="10.5" r=".75" fill="currentColor" stroke="none"/></svg>
      Período <span id="filterBadge" style="display:none" class="filter-badge">1</span>
    </button>
    <button class="btn" id="btnRefresh" onclick="loadData()">↻ Atualizar</button>
  </div>
</div>

<!-- MODAL FILTRO -->
<div class="modal-bg" id="modalBg" onclick="handleBgClick(event)">
  <div class="modal">
    <h2>Filtrar período</h2>
    <div class="modal-section">
      <label>Mês</label>
      <div class="pill-group" id="pillMonths"></div>
    </div>
    <div class="modal-section" id="weekSection" style="display:none">
      <label>Semana</label>
      <div class="pill-group" id="pillWeeks"></div>
    </div>
    <button class="modal-close" onclick="closeFilter()">Fechar</button>
  </div>
</div>

<div id="root"><div style="text-align:center;padding:60px;color:#999;font-size:13px">Carregando dados…</div></div>

<script>
const SHEET_ID = '1f6QhW9hMR7EBq5KrgKhFxVEHvyvjxbcshcevSYJkVi8';

// ── Nomes das abas conhecidos — adicione novas abas aqui ─────────────────────
// O sistema tentará buscar automaticamente qualquer aba listada.
// Para adicionar um novo mês, basta adicionar ao array abaixo.
const KNOWN_SHEETS = [
  { key:'nov',  label:'Novembro',   sheet:'Novembro'   },
  { key:'dez',  label:'Dezembro',   sheet:'Dezembro'   },
  { key:'jan',  label:'Janeiro',    sheet:'Jan/2026'   },
  { key:'fev',  label:'Fevereiro',  sheet:'Fev/2026'   },
  { key:'mar',  label:'Março',      sheet:'Mar/2026'   },
  { key:'abr',  label:'Abril',      sheet:'Abril/2026' },
  { key:'mai',  label:'Maio',       sheet:'Maio/2026'  },
  // { key:'jun', label:'Junho', sheet:'Jun/2026' }, // ← descomente quando criar a aba
];

// Estado do filtro
let state = {
  allData: {},        // key → { monthly, weekly }
  availableSheets: [],// abas que existem na planilha
  selMonth: null,     // chave do mês selecionado
  selWeek: null,      // label da semana selecionada (ou null = mensal)
};

// ── Fetch CSV ─────────────────────────────────────────────────────────────────
async function fetchSheet(sheetName) {
  const url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
    '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(sheetName);
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  return parseCSV(text);
}

function parseCSV(text) {
  return text.trim().split('\n').map(line => {
    const cols = []; let cur = ''; let inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    return cols;
  });
}

// ── Extrai valor: pega última célula não vazia da linha ───────────────────────
function extract(rows, ...keywords) {
  const kws = keywords.map(k => k.toLowerCase());
  for (const r of rows) {
    const lbl = (r[0] || '').toLowerCase().trim();
    if (!lbl) continue;
    if (!kws.some(k => lbl.includes(k))) continue;
    for (let i = r.length - 1; i >= 1; i--) {
      const v = (r[i] || '').trim();
      if (v && v !== '-' && v !== '\\-' && v !== '—' && !v.startsWith('#')) return toNum(v);
    }
  }
  return null;
}

// Extrai valor de uma coluna específica (para semanas)
function extractCol(rows, keyword, colIdx) {
  const kw = keyword.toLowerCase();
  for (const r of rows) {
    const lbl = (r[0] || '').toLowerCase().trim();
    if (lbl.includes(kw) && r[colIdx] !== undefined) {
      const v = (r[colIdx] || '').trim();
      if (v && v !== '-' && v !== '\\-' && v !== '—' && !v.startsWith('#')) return toNum(v);
    }
  }
  return null;
}

// Detecta cabeçalhos de semana de uma aba (linha que começa com "Indicador")
function detectWeeks(rows) {
  for (const r of rows) {
    if ((r[0] || '').toLowerCase().trim() === 'indicador') {
      return r.slice(1).filter(h => h && h.toLowerCase().includes('semana'));
    }
  }
  return [];
}

// Índices das colunas de semana
function weekColIndices(rows) {
  for (const r of rows) {
    if ((r[0] || '').toLowerCase().trim() === 'indicador') {
      const res = [];
      r.forEach((h, i) => { if (i > 0 && h && h.toLowerCase().includes('semana')) res.push(i); });
      return { headers: r.slice(1).filter(h => h && h.toLowerCase().includes('semana')), indices: res };
    }
  }
  return { headers: [], indices: [] };
}

function toNum(v) {
  if (v == null) return null;
  const s = String(v).replace(/[R$\s]/g,'').replace(/\./g,'').replace(',','.').trim();
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

function fmt(v) {
  if (v === null || v === undefined) return '—';
  if (Math.abs(v) >= 1e6) return (v/1e6).toFixed(1) + 'M';
  return v.toLocaleString('pt-BR');
}

function pct(a, b) {
  if (a == null || b == null || a === 0) return null;
  return Math.round(((b - a) / Math.abs(a)) * 100);
}

function bk(v, dir) {
  if (v === null) return '<span class="bk na">sem dado</span>';
  if (v === 0) return '<span class="bk nt">=</span>';
  const pos = v > 0;
  const cls = dir === 'good' ? (pos ? 'gn' : 'rd') : (pos ? 'rd' : 'gn');
  return `<span class="bk ${cls}">${pos ? '+' : ''}${v}%</span>`;
}

// ── Parse mensal ──────────────────────────────────────────────────────────────
function parseMonthly(rows) {
  return {
    eng_tarefas:   extract(rows, 'tarefas/story entregues', 'tarefas/story'),
    eng_bugs:      extract(rows, 'bugs corrigidos'),
    eng_backlog:   extract(rows, 'bugs em backlog'),
    eng_wip:       extract(rows, 'em andamento', 'demandas em andamento'),
    inf_inc:       extract(rows, 'incidentes (infra', 'incidentes no mês', 'incidentes críticos'),
    inf_n8n:       extract(rows, 'falhas nos workflows do n8n', 'falhas em workflows do n8n por infra (crashes)'),
    inf_n8n_infra: extract(rows, 'falhas em workflows do n8n por infra (crashes)'),
    inf_n3:        extract(rows, 'demandas n3'),
    inf_msg:       extract(rows, 'mensagens trocadas'),
    inf_logins:    extract(rows, 'logins'),
    inf_oracle:    extract(rows, 'consumo de nuvem em créditos ($$) - oracle'),
    inf_oracle_ia: extract(rows, 'consumo de ia em créditos ($$) - oracle'),
    inf_openai:    extract(rows, 'consumo de ia em créditos ($$) - open'),
    dat_plan:      extract(rows, 'demandas planejadas'),
    dat_entr:      extract(rows, 'demandas entregues'),
    dat_atrs:      extract(rows, 'demandas atrasadas'),
    dat_pipe:      extract(rows, 'falhas na execução da pipeline'),
    dat_dash:      extract(rows, 'falhas em dashboards'),
  };
}

// ── Parse semanal ─────────────────────────────────────────────────────────────
function parseWeekly(rows) {
  const { headers, indices } = weekColIndices(rows);
  return headers.map((h, i) => ({
    label: h,
    data: {
      eng_tarefas:   extractCol(rows, 'tarefas/story entregues', indices[i]),
      eng_bugs:      extractCol(rows, 'bugs corrigidos', indices[i]),
      eng_backlog:   extractCol(rows, 'bugs em backlog', indices[i]),
      eng_wip:       extractCol(rows, 'em andamento', indices[i]),
      inf_inc:       extractCol(rows, 'incidentes', indices[i]),
      inf_n8n:       extractCol(rows, 'falhas nos workflows', indices[i]),
      inf_n8n_infra: extractCol(rows, 'falhas em workflows do n8n por infra', indices[i]),
      inf_n3:        extractCol(rows, 'demandas n3', indices[i]),
      dat_plan:      extractCol(rows, 'demandas planejadas', indices[i]),
      dat_entr:      extractCol(rows, 'demandas entregues', indices[i]),
      dat_atrs:      extractCol(rows, 'demandas atrasadas', indices[i]),
      dat_pipe:      extractCol(rows, 'falhas na execução da pipeline', indices[i]),
      dat_dash:      extractCol(rows, 'falhas em dashboards', indices[i]),
    }
  }));
}

// ── Gráficos ──────────────────────────────────────────────────────────────────
let charts = {};
function dch() { Object.values(charts).forEach(c => c.destroy()); charts = {}; }

function mkBar(id, labels, datasets) {
  const el = document.getElementById(id); if (!el) return;
  charts[id] = new Chart(el, { type:'bar', data:{labels,datasets},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{ticks:{font:{size:11},color:'#999'},grid:{display:false}},
              y:{ticks:{font:{size:11},color:'#999',callback:v=>Math.abs(v)>=1000?Math.round(v/1000)+'k':v},grid:{color:'rgba(0,0,0,.06)'},beginAtZero:true}}}});
}
function mkLine(id, labels, datasets) {
  const el = document.getElementById(id); if (!el) return;
  charts[id] = new Chart(el, { type:'line', data:{labels,datasets},
    options:{responsive:true,maintainAspectRatio:false,spanGaps:true,plugins:{legend:{display:false}},
      scales:{x:{ticks:{font:{size:11},color:'#999'},grid:{display:false}},
              y:{ticks:{font:{size:11},color:'#999',callback:v=>Math.abs(v)>=1000?Math.round(v/1000)+'k':v},grid:{color:'rgba(0,0,0,.06)'}}}}});
}

// ── Render ────────────────────────────────────────────────────────────────────
function getKPIs() {
  const { allData, availableSheets, selMonth, selWeek } = state;
  if (selMonth && selWeek) {
    // visão semanal de um mês
    const weeks = allData[selMonth]?.weekly || [];
    const wk = weeks.find(w => w.label === selWeek);
    return { mode:'week', label: selMonth + ' · ' + selWeek, single: wk?.data || {} };
  }
  if (selMonth) {
    // visão mensal de um mês específico
    return { mode:'single', label: KNOWN_SHEETS.find(s=>s.key===selMonth)?.label || selMonth,
             single: allData[selMonth]?.monthly || {} };
  }
  // visão comparativa padrão (últimos 3 meses disponíveis)
  const last3 = availableSheets.slice(-3);
  return {
    mode: 'compare',
    months: last3.map(k => ({ key:k, label: KNOWN_SHEETS.find(s=>s.key===k)?.label || k, d: allData[k]?.monthly || {} }))
  };
}

function render() {
  dch();
  const kpis = getKPIs();

  if (kpis.mode === 'compare') {
    renderCompare(kpis.months);
  } else {
    renderSingle(kpis.single, kpis.label, kpis.mode === 'week');
  }
}

function renderCompare(months) {
  const M = months.map(m => m.label);
  const g = k => months.map(m => m.d[k]);
  const ev=g('eng_tarefas'), eb=g('eng_bugs'), ew=g('eng_wip'), ebk=g('eng_backlog');
  const ii=g('inf_inc'), in8=g('inf_n8n'), in8i=g('inf_n8n_infra');
  const dp=g('dat_plan'), de=g('dat_entr'), da=g('dat_atrs'), dpi=g('dat_pipe'), dd=g('dat_dash');
  const last = months.length - 1;
  const prev = last - 1;
  const taxa = dp[last]>0 ? Math.round(de[last]/dp[last]*100) : null;
  const lbl = months[last]?.label || '';

  const COLORS = ['#B5D4F4','#9FE1CB','#FAC775','#C9B8F4','#F4B8C9'];
  const BORDERS = ['#378ADD','#1D9E75','#EF9F27','#7C5ABF','#BF3F6B'];

  document.getElementById('root').innerHTML = `
  <div class="wrap">
    <div class="tabs">
      <button class="tab active all" onclick="setTab('all')">Visão geral</button>
      <button class="tab eng" onclick="setTab('eng')">Engenharia</button>
      <button class="tab inf" onclick="setTab('inf')">Infra</button>
      <button class="tab dat" onclick="setTab('dat')">Dados</button>
    </div>
    <div class="sec visible" id="sec-all">
      <div class="sl">Destaques — ${lbl}</div>
      <div class="cards">
        <div class="card"><div class="lbl">Tarefas entregues</div><div class="val">${fmt(ev[last])}</div><div class="sub">${bk(pct(ev[prev],ev[last]),'good')} vs anterior</div></div>
        <div class="card"><div class="lbl">Bugs corrigidos</div><div class="val">${fmt(eb[last])}</div><div class="sub">${bk(pct(eb[prev],eb[last]),'good')} vs anterior</div></div>
        <div class="card"><div class="lbl">Incidentes Infra</div><div class="val">${fmt(ii[last])}</div><div class="sub">${bk(pct(ii[prev],ii[last]),'bad')} vs anterior</div></div>
        <div class="card"><div class="lbl">Falhas n8n</div><div class="val" style="font-size:17px">${fmt(in8[last])}</div><div class="sub">${bk(pct(in8[prev],in8[last]),'bad')} vs anterior</div></div>
        <div class="card"><div class="lbl">Demandas Dados</div><div class="val">${fmt(de[last])}/${fmt(dp[last])}</div><div class="sub">${taxa!==null?`<span class="bk am">${taxa}%</span> taxa`:''}</div></div>
        <div class="card"><div class="lbl">Falhas dashboards</div><div class="val" style="font-size:17px">${fmt(dd[last])}</div><div class="sub">${bk(pct(dd[0],dd[last]),'bad')} vs ${months[0]?.label||''}</div></div>
      </div>
      <div class="sl">Tarefas, bugs e incidentes</div>
      <div class="leg">${M.map((m,i)=>`<span><span class="leg-sq" style="background:${COLORS[i%COLORS.length]}"></span>${m}</span>`).join('')}</div>
      <div class="cw" style="height:250px"><canvas id="c-all-bar"></canvas></div>
      <div class="sl">Falhas n8n — evolução</div>
      <div class="cw" style="height:190px"><canvas id="c-all-n8n"></canvas></div>
    </div>
    <div class="sec" id="sec-eng">
      <div class="sl" style="color:#3B6D11">Comparativo mensal</div>
      <div class="cards">
        <div class="card"><div class="lbl">Tarefas (${lbl})</div><div class="val">${fmt(ev[last])}</div><div class="sub">${bk(pct(ev[prev],ev[last]),'good')} vs anterior</div></div>
        <div class="card"><div class="lbl">Bugs corrigidos</div><div class="val">${fmt(eb[last])}</div><div class="sub">${bk(pct(eb[prev],eb[last]),'good')} vs anterior</div></div>
        <div class="card"><div class="lbl">Backlog bugs</div><div class="val">${fmt(ebk[last])}</div><div class="sub" style="color:#999;font-size:11px">${months[0]?.label}: ${fmt(ebk[0])}</div></div>
        <div class="card"><div class="lbl">WIP</div><div class="val">${fmt(ew[last])}</div><div class="sub">${bk(pct(ew[prev],ew[last]),'bad')} vs anterior</div></div>
      </div>
      <div class="tw"><table>
        <thead><tr><th style="text-align:left">Indicador</th>${M.map(m=>`<th>${m}</th>`).join('')}${months.length>=2?`<th>${months[months.length-2].label}→${months[months.length-1].label}</th>`:''}</tr></thead>
        <tbody>
          <tr><td>Tarefas/Story entregues</td>${ev.map(v=>`<td>${fmt(v)}</td>`).join('')}<td>${bk(pct(ev[prev],ev[last]),'good')}</td></tr>
          <tr><td>Bugs corrigidos</td>${eb.map(v=>`<td>${fmt(v)}</td>`).join('')}<td>${bk(pct(eb[prev],eb[last]),'good')}</td></tr>
          <tr><td>Bugs em backlog</td>${ebk.map(v=>`<td>${fmt(v)}</td>`).join('')}<td><span class="bk na">sem dado</span></td></tr>
          <tr><td>Demandas em andamento (WIP)</td>${ew.map(v=>`<td>${fmt(v)}</td>`).join('')}<td>${bk(pct(ew[prev],ew[last]),'bad')}</td></tr>
        </tbody>
      </table></div>
      <div class="sl">Evolução — tarefas, bugs e WIP</div>
      <div class="leg">

// ── Filtro ────────────────────────────────────────────────────────────────────
function buildFilterUI() {
  const { availableSheets, allData, selMonth, selWeek } = state;
  const pmEl = document.getElementById('pillMonths');
  const pwEl = document.getElementById('pillWeeks');
  const wkSec = document.getElementById('weekSection');

  pmEl.innerHTML = availableSheets.map(k => {
    const s = KNOWN_SHEETS.find(x => x.key === k);
    const lbl = s?.label || k;
    return `<button class="pill${selMonth===k?' active':''}" onclick="selectMonth('${k}')">${lbl}</button>`;
  }).join('');

  if (selMonth) {
    const weeks = allData[selMonth]?.weekly || [];
    if (weeks.length > 0) {
      wkSec.style.display = '';
      pwEl.innerHTML = weeks.map(w =>
        `<button class="pill${selWeek===w.label?' active':''}" onclick="selectWeek('${w.label}')">${w.label}</button>`
      ).join('');
    } else {
      wkSec.style.display = 'none';
    }
  } else {
    wkSec.style.display = 'none';
  }

  // badge
  const active = selMonth ? 1 : 0;
  const badge = document.getElementById('filterBadge');
  badge.style.display = active ? 'inline-flex' : 'none';
  badge.textContent = active;
}

function selectMonth(key) {
  if (state.selMonth === key) {
    state.selMonth = null; state.selWeek = null;
  } else {
    state.selMonth = key; state.selWeek = null;
  }
  buildFilterUI();
  render();
}

function selectWeek(label) {
  state.selWeek = state.selWeek === label ? null : label;
  buildFilterUI();
  render();
}

function toggleFilter() {
  document.getElementById('modalBg').classList.toggle('open');
  buildFilterUI();
}
function closeFilter() { document.getElementById('modalBg').classList.remove('open'); }
function handleBgClick(e) { if (e.target === document.getElementById('modalBg')) closeFilter(); }

function setTab(t) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.sec').forEach(s => s.classList.remove('visible'));
  document.querySelector('.tab.' + t).classList.add('active');
  document.getElementById('sec-' + t).classList.add('visible');
}

// ── Load ──────────────────────────────────────────────────────────────────────
async function loadData() {
  const btn = document.getElementById('btnRefresh');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin">↻</span> Buscando…';

  try {
    // tenta buscar todas as abas conhecidas; ignora as que não existem (404)
    const results = await Promise.allSettled(
      KNOWN_SHEETS.map(s => fetchSheet(s.sheet).then(rows => ({ key: s.key, rows })))
    );

    state.allData = {};
    state.availableSheets = [];

    for (const r of results) {
      if (r.status === 'fulfilled') {
        const { key, rows } = r.value;
        state.allData[key] = {
          monthly: parseMonthly(rows),
          weekly:  parseWeekly(rows),
        };
        state.availableSheets.push(key);
      }
    }

    // se mês selecionado sumiu, reseta
    if (state.selMonth && !state.availableSheets.includes(state.selMonth)) {
      state.selMonth = null; state.selWeek = null;
    }

    render();
    document.getElementById('upd').textContent = 'Atualizado ' +
      new Date().toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
  } catch(e) {
    document.getElementById('root').innerHTML =
      `<div class="wrap"><div class="err">⚠️ Erro: <b>${e.message}</b></div></div>`;
  }

  btn.disabled = false;
  btn.innerHTML = '↻ Atualizar';
}

loadData();
